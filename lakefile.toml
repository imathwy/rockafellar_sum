name = "rockafellar_sum"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["rockafellar_sum", "S2"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "rockafellar_sum"

[[lean_lib]]
name = "S2"

[[lean_lib]]
name = "ReasLib"
roots = ["ReasLib"]
globs = ["ReasLib.*"]
