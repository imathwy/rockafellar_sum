name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false

      - name: Check project entry points
        run: |
          lake lean ReasLib.lean
          lake lean S2.lean
          lake lean rockafellar_sum.lean

      - name: Reject proof placeholders
        shell: bash
        run: |
          set -euo pipefail
          set +e
          grep -RInE --include='*.lean' \
            '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)|^[[:space:]]*(private[[:space:]]+)?(axiom|opaque|unsafe)([[:space:]]|$)|(^|[^[:alnum:]_])(native_decide|ofReduceBool|implemented_by)([^[:alnum:]_]|$)' \
            ReasLib S2 ReasLib.lean S2.lean rockafellar_sum.lean
          scan_status=$?
          set -e
          if [ "$scan_status" -gt 1 ]; then
            echo "proof-placeholder scanner failed with exit code $scan_status" >&2
            exit "$scan_status"
          elif [ "$scan_status" -eq 0 ]; then
            echo 'proof placeholder found in production source' >&2
            exit 1
          fi
